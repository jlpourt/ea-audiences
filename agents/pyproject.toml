[project]
name = "twok-courtside-adk-fleet"
version = "1.0.0"
description = "Production Vertex AI ADK Multi-Agent Fleet for 2K Courtside Audience Builder & Courtside Focus Group Simulation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "google-adk>=1.0.0",
    "google-genai>=1.16.0",
    "google-cloud-spanner>=3.40.0",
    "google-cloud-bigquery>=3.18.0",
    "google-cloud-storage>=2.14.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

